name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-test-jwt-secret-with-at-least-32-characters # pragma: allowlist secret
      DEEPSEEK_API_KEY: ci-test-deepseek-key-placeholder # pragma: allowlist secret
      SILICONFLOW_API_KEY: ci-test-siliconflow-key-placeholder # pragma: allowlist secret
      MEM0_DIR: /tmp/qaagent-mem0
      TRACE_DIR: /tmp/qaagent-traces
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-test-jwt-secret-with-at-least-32-characters # pragma: allowlist secret
      DEEPSEEK_API_KEY: ci-test-deepseek-key-placeholder # pragma: allowlist secret
      SILICONFLOW_API_KEY: ci-test-siliconflow-key-placeholder # pragma: allowlist secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: qa_agent_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: 6379
      RUN_POSTGRES_TESTS: "1"
      RUN_VALKEY_TESTS: "1"
      MEM0_DIR: /tmp/qaagent-mem0
      TRACE_DIR: /tmp/qaagent-traces
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: qa_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration -q
